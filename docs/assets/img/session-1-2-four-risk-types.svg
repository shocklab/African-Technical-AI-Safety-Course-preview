<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1328 1097.5" width="1328" height="1097.5" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" role="img" aria-label="The four types of catastrophic AI risk, their subtypes and mitigations, after Hendrycks, Mazeika and Woodside 2023">
<rect width="1328" height="1097.5" fill="#ffffff"/>
<text x="34" y="52" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" fill="#003A70">Four types of catastrophic AI risk</text>
<text x="34" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#2a5298" letter-spacing="1.6">HENDRYCKS, MAZEIKA &amp; WOODSIDE (2023) · ARXIV:2306.12001</text>
<text x="34" y="104" font-size="14" fill="#5a6672">Each column is one of the paper's four risk sources, with the subtypes it names and the mitigations it proposes. Read across: the first three are about people and institutions,</text>
<text x="34" y="123" font-size="14" fill="#5a6672">the fourth about the system itself.</text>
<rect x="34" y="150" width="300" height="817.5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1"/>
<rect x="34" y="150" width="300" height="116" fill="#003A70"/>
<text x="52" y="176" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#9dc0e8" letter-spacing="1.6">§2</text>
<text x="52" y="200" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="19" fill="#ffffff">Malicious use</text>
<text x="52" y="218" font-size="11.8" fill="#cddcee">People deliberately direct AI at harm. The</text>
<text x="52" y="232" font-size="11.8" fill="#cddcee">system works as intended; the intent behind</text>
<text x="52" y="246" font-size="11.8" fill="#cddcee">it is the hazard.</text>
<text x="52" y="288" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">RISK SUBTYPES</text>
<circle cx="56" cy="307" r="3" fill="#2a5298"/>
<text x="68" y="312" font-size="15.5" font-weight="600" fill="#2c3e50">Bioterrorism</text>
<text x="68" y="329" font-size="12.4" fill="#5a6672">§2.1 · lowering the expertise barrier</text>
<text x="68" y="344" font-size="12.4" fill="#5a6672">to engineered pathogens</text>
<circle cx="56" cy="370" r="3" fill="#2a5298"/>
<text x="68" y="375" font-size="15.5" font-weight="600" fill="#2c3e50">Unleashing AI agents</text>
<text x="68" y="392" font-size="12.4" fill="#5a6672">§2.2 · agents released to pursue</text>
<text x="68" y="407" font-size="12.4" fill="#5a6672">open-ended goals</text>
<circle cx="56" cy="433" r="3" fill="#2a5298"/>
<text x="68" y="438" font-size="15.5" font-weight="600" fill="#2c3e50">Persuasive AIs</text>
<text x="68" y="455" font-size="12.4" fill="#5a6672">§2.3 · manipulation and tailored</text>
<text x="68" y="470" font-size="12.4" fill="#5a6672">disinformation at scale</text>
<circle cx="56" cy="496" r="3" fill="#2a5298"/>
<text x="68" y="501" font-size="15.5" font-weight="600" fill="#2c3e50">Concentration of power</text>
<text x="68" y="518" font-size="12.4" fill="#5a6672">§2.4 · surveillance and censorship</text>
<text x="68" y="533" font-size="12.4" fill="#5a6672">entrenching a few actors</text>
<rect x="35" y="564" width="298" height="402.5" fill="#f5f7f9"/>
<rect x="35" y="564" width="3" height="402.5" fill="#2a5298"/>
<text x="52" y="588" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">MITIGATIONS</text>
<text x="52" y="610" font-size="12.8" fill="#2a5298">→</text>
<text x="66" y="610.0" font-size="12.8" fill="#2c3e50">Biosecurity: access controls on</text>
<text x="66" y="626.5" font-size="12.8" fill="#2c3e50">bio-capable models, excise biological</text>
<text x="66" y="643.0" font-size="12.8" fill="#2c3e50">capability, plus general biodefence</text>
<text x="66" y="659.5" font-size="12.8" fill="#2c3e50">(wastewater monitoring, far-UV, PPE)</text>
<text x="52" y="687.0" font-size="12.8" fill="#2a5298">→</text>
<text x="66" y="687.0" font-size="12.8" fill="#2c3e50">Restricted access: structured access</text>
<text x="66" y="703.5" font-size="12.8" fill="#2c3e50">via cloud APIs, know-your-customer</text>
<text x="66" y="720.0" font-size="12.8" fill="#2c3e50">screening, compute and export</text>
<text x="66" y="736.5" font-size="12.8" fill="#2c3e50">controls, safety case required before</text>
<text x="66" y="753.0" font-size="12.8" fill="#2c3e50">open-sourcing</text>
<text x="52" y="780.5" font-size="12.8" fill="#2a5298">→</text>
<text x="66" y="780.5" font-size="12.8" fill="#2c3e50">Adversarially robust anomaly</text>
<text x="66" y="797.0" font-size="12.8" fill="#2c3e50">detection, as a second line of defence</text>
<text x="66" y="813.5" font-size="12.8" fill="#2c3e50">once misuse happens</text>
<text x="52" y="841.0" font-size="12.8" fill="#2a5298">→</text>
<text x="66" y="841.0" font-size="12.8" fill="#2c3e50">Legal liability for developers of</text>
<text x="66" y="857.5" font-size="12.8" fill="#2c3e50">general-purpose AI, so costs reflect</text>
<text x="66" y="874.0" font-size="12.8" fill="#2c3e50">externalities</text>
<rect x="354" y="150" width="300" height="817.5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1"/>
<rect x="354" y="150" width="300" height="116" fill="#003A70"/>
<text x="372" y="176" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#9dc0e8" letter-spacing="1.6">§3</text>
<text x="372" y="200" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="19" fill="#ffffff">AI race</text>
<text x="372" y="218" font-size="11.8" fill="#cddcee">Competition between states and firms makes</text>
<text x="372" y="232" font-size="11.8" fill="#cddcee">cutting corners on safety individually</text>
<text x="372" y="246" font-size="11.8" fill="#cddcee">rational and collectively disastrous.</text>
<text x="372" y="288" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">RISK SUBTYPES</text>
<circle cx="376" cy="307" r="3" fill="#2a5298"/>
<text x="388" y="312" font-size="15.5" font-weight="600" fill="#2c3e50">Military AI arms race</text>
<text x="388" y="329" font-size="12.4" fill="#5a6672">§3.1 · autonomous weapons,</text>
<text x="388" y="344" font-size="12.4" fill="#5a6672">cyberwarfare, automated warfare</text>
<circle cx="376" cy="370" r="3" fill="#2a5298"/>
<text x="388" y="375" font-size="15.5" font-weight="600" fill="#2c3e50">Corporate AI race</text>
<text x="388" y="392" font-size="12.4" fill="#5a6672">§3.2 · economic competition undercuts</text>
<text x="388" y="407" font-size="12.4" fill="#5a6672">safety; automated economy</text>
<circle cx="376" cy="433" r="3" fill="#2a5298"/>
<text x="388" y="438" font-size="15.5" font-weight="600" fill="#2c3e50">Evolutionary pressures</text>
<text x="388" y="455" font-size="12.4" fill="#5a6672">§3.3 · selection favours the most</text>
<text x="388" y="470" font-size="12.4" fill="#5a6672">competitive, not the safest, AI</text>
<rect x="355" y="564" width="298" height="402.5" fill="#f5f7f9"/>
<rect x="355" y="564" width="3" height="402.5" fill="#2a5298"/>
<text x="372" y="588" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">MITIGATIONS</text>
<text x="372" y="610" font-size="12.8" fill="#2a5298">→</text>
<text x="386" y="610.0" font-size="12.8" fill="#2c3e50">Safety regulation: proactive, not</text>
<text x="386" y="626.5" font-size="12.8" fill="#2c3e50">written in blood; independently</text>
<text x="386" y="643.0" font-size="12.8" fill="#2c3e50">staffed regulators</text>
<text x="372" y="670.5" font-size="12.8" fill="#2a5298">→</text>
<text x="386" y="670.5" font-size="12.8" fill="#2c3e50">Data documentation: report and justify</text>
<text x="386" y="687.0" font-size="12.8" fill="#2c3e50">training-data sources</text>
<text x="372" y="714.5" font-size="12.8" fill="#2a5298">→</text>
<text x="386" y="714.5" font-size="12.8" fill="#2c3e50">Meaningful human oversight of AI</text>
<text x="386" y="731.0" font-size="12.8" fill="#2c3e50">decisions, nuclear command and control</text>
<text x="386" y="747.5" font-size="12.8" fill="#2c3e50">above all</text>
<text x="372" y="775.0" font-size="12.8" fill="#2a5298">→</text>
<text x="386" y="775.0" font-size="12.8" fill="#2c3e50">AI for cyberdefence, to lower the</text>
<text x="386" y="791.5" font-size="12.8" fill="#2c3e50">payoff from AI-enabled attack</text>
<text x="372" y="819.0" font-size="12.8" fill="#2a5298">→</text>
<text x="386" y="819.0" font-size="12.8" fill="#2c3e50">International coordination, with</text>
<text x="386" y="835.5" font-size="12.8" fill="#2c3e50">verification and enforcement attached</text>
<text x="372" y="863.0" font-size="12.8" fill="#2a5298">→</text>
<text x="386" y="863.0" font-size="12.8" fill="#2c3e50">Public control of general-purpose AI:</text>
<text x="386" y="879.5" font-size="12.8" fill="#2c3e50">a CERN-like joint effort rather than a</text>
<text x="386" y="896.0" font-size="12.8" fill="#2c3e50">race</text>
<rect x="674" y="150" width="300" height="817.5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1"/>
<rect x="674" y="150" width="300" height="116" fill="#003A70"/>
<text x="692" y="176" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#9dc0e8" letter-spacing="1.6">§4</text>
<text x="692" y="200" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="19" fill="#ffffff">Organizational risks</text>
<text x="692" y="218" font-size="11.8" fill="#cddcee">No malice and no race needed. Accidents are</text>
<text x="692" y="232" font-size="11.8" fill="#cddcee">normal in complex systems, and weak safety</text>
<text x="692" y="246" font-size="11.8" fill="#cddcee">culture turns them into catastrophes.</text>
<text x="692" y="288" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">RISK SUBTYPES</text>
<circle cx="696" cy="307" r="3" fill="#2a5298"/>
<text x="708" y="312" font-size="15.5" font-weight="600" fill="#2c3e50">Accidents are hard to avoid</text>
<text x="708" y="329" font-size="12.4" fill="#5a6672">§4.1 · Perrow's normal accidents;</text>
<text x="708" y="344" font-size="12.4" fill="#5a6672">opaque, unreliable components</text>
<circle cx="696" cy="370" r="3" fill="#2a5298"/>
<text x="708" y="375" font-size="15.5" font-weight="600" fill="#2c3e50">Weak safety culture</text>
<text x="708" y="392" font-size="12.4" fill="#5a6672">§4.2 · safety as constraint rather than</text>
<text x="708" y="407" font-size="12.4" fill="#5a6672">objective</text>
<circle cx="696" cy="433" r="3" fill="#2a5298"/>
<text x="708" y="438" font-size="15.5" font-weight="600" fill="#2c3e50">No security mindset</text>
<text x="708" y="455" font-size="12.4" fill="#5a6672">§4.2 · failure modes that are</text>
<text x="708" y="470" font-size="12.4" fill="#5a6672">surprising and unintuitive</text>
<rect x="675" y="564" width="298" height="402.5" fill="#f5f7f9"/>
<rect x="675" y="564" width="3" height="402.5" fill="#2a5298"/>
<text x="692" y="588" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">MITIGATIONS</text>
<text x="692" y="610" font-size="12.8" fill="#2a5298">→</text>
<text x="706" y="610.0" font-size="12.8" fill="#2c3e50">External red teaming before deployment</text>
<text x="706" y="626.5" font-size="12.8" fill="#2c3e50">decisions</text>
<text x="692" y="654.0" font-size="12.8" fill="#2a5298">→</text>
<text x="706" y="654.0" font-size="12.8" fill="#2c3e50">Affirmative demonstration of safety:</text>
<text x="706" y="670.5" font-size="12.8" fill="#2c3e50">burden of proof on the developer,</text>
<text x="706" y="687.0" font-size="12.8" fill="#2c3e50">before training</text>
<text x="692" y="714.5" font-size="12.8" fill="#2a5298">→</text>
<text x="706" y="714.5" font-size="12.8" fill="#2c3e50">Deployment procedures: staged release;</text>
<text x="706" y="731.0" font-size="12.8" fill="#2c3e50">publication and dual-use review</text>
<text x="692" y="758.5" font-size="12.8" fill="#2a5298">→</text>
<text x="706" y="758.5" font-size="12.8" fill="#2c3e50">Response plans for security and safety</text>
<text x="706" y="775.0" font-size="12.8" fill="#2c3e50">incidents</text>
<text x="692" y="802.5" font-size="12.8" fill="#2a5298">→</text>
<text x="706" y="802.5" font-size="12.8" fill="#2c3e50">Internal auditing and risk management:</text>
<text x="706" y="819.0" font-size="12.8" fill="#2c3e50">a chief risk officer, audit team</text>
<text x="706" y="835.5" font-size="12.8" fill="#2c3e50">reporting to the board</text>
<text x="692" y="863.0" font-size="12.8" fill="#2a5298">→</text>
<text x="706" y="863.0" font-size="12.8" fill="#2c3e50">Safe design principles: defence in</text>
<text x="706" y="879.5" font-size="12.8" fill="#2c3e50">depth, redundancy, loose coupling,</text>
<text x="706" y="896.0" font-size="12.8" fill="#2c3e50">separation of duties, fail-safe design</text>
<text x="692" y="923.5" font-size="12.8" fill="#2a5298">→</text>
<text x="706" y="923.5" font-size="12.8" fill="#2c3e50">State-of-the-art information security</text>
<text x="706" y="940.0" font-size="12.8" fill="#2c3e50">on weights and research IP</text>
<rect x="994" y="150" width="300" height="817.5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1"/>
<rect x="994" y="150" width="300" height="116" fill="#003A70"/>
<text x="1012" y="176" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#9dc0e8" letter-spacing="1.6">§5</text>
<text x="1012" y="200" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="19" fill="#ffffff">Rogue AIs</text>
<text x="1012" y="218" font-size="11.8" fill="#cddcee">Control of the system itself is lost.</text>
<text x="1012" y="232" font-size="11.8" fill="#cddcee">Inherent to the technology, so the response</text>
<text x="1012" y="246" font-size="11.8" fill="#cddcee">is more technical than social.</text>
<text x="1012" y="288" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">RISK SUBTYPES</text>
<circle cx="1016" cy="307" r="3" fill="#2a5298"/>
<text x="1028" y="312" font-size="15.5" font-weight="600" fill="#2c3e50">Proxy gaming</text>
<text x="1028" y="329" font-size="12.4" fill="#5a6672">§5.1 · optimising the measurable</text>
<text x="1028" y="344" font-size="12.4" fill="#5a6672">stand-in, not the goal</text>
<circle cx="1016" cy="370" r="3" fill="#2a5298"/>
<text x="1028" y="375" font-size="15.5" font-weight="600" fill="#2c3e50">Goal drift</text>
<text x="1028" y="392" font-size="12.4" fill="#5a6672">§5.2 · goals shifting as the system and</text>
<text x="1028" y="407" font-size="12.4" fill="#5a6672">its environment change</text>
<circle cx="1016" cy="433" r="3" fill="#2a5298"/>
<text x="1028" y="438" font-size="15.5" font-weight="600" fill="#2c3e50">Power-seeking</text>
<text x="1028" y="455" font-size="12.4" fill="#5a6672">§5.3 · resources and self-preservation</text>
<text x="1028" y="470" font-size="12.4" fill="#5a6672">serve almost any objective</text>
<circle cx="1016" cy="496" r="3" fill="#2a5298"/>
<text x="1028" y="501" font-size="15.5" font-weight="600" fill="#2c3e50">Deception</text>
<text x="1028" y="518" font-size="12.4" fill="#5a6672">§5.4 · appearing aligned while pursuing</text>
<text x="1028" y="533" font-size="12.4" fill="#5a6672">something else</text>
<rect x="995" y="564" width="298" height="402.5" fill="#f5f7f9"/>
<rect x="995" y="564" width="3" height="402.5" fill="#2a5298"/>
<text x="1012" y="588" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.6" fill="#2a5298" letter-spacing="1.5">MITIGATIONS</text>
<text x="1012" y="610" font-size="12.8" fill="#2a5298">→</text>
<text x="1026" y="610.0" font-size="12.8" fill="#2c3e50">Avoid the riskiest use cases: no</text>
<text x="1026" y="626.5" font-size="12.8" fill="#2c3e50">open-ended real-world goals, no</text>
<text x="1026" y="643.0" font-size="12.8" fill="#2c3e50">critical infrastructure, until control</text>
<text x="1026" y="659.5" font-size="12.8" fill="#2c3e50">is demonstrated</text>
<text x="1012" y="687.0" font-size="12.8" fill="#2a5298">→</text>
<text x="1026" y="687.0" font-size="12.8" fill="#2c3e50">Symmetric international off-switch,</text>
<text x="1026" y="703.5" font-size="12.8" fill="#2c3e50">agreed across the US, UK and China</text>
<text x="1012" y="731.0" font-size="12.8" fill="#2a5298">→</text>
<text x="1026" y="731.0" font-size="12.8" fill="#2c3e50">Legal liability for cloud compute</text>
<text x="1026" y="747.5" font-size="12.8" fill="#2c3e50">providers hosting rogue agents</text>
<text x="1012" y="775.0" font-size="12.8" fill="#2a5298">→</text>
<text x="1026" y="775.0" font-size="12.8" fill="#2c3e50">Technical safety research: adversarial</text>
<text x="1026" y="791.5" font-size="12.8" fill="#2c3e50">robustness of proxy models · model</text>
<text x="1026" y="808.0" font-size="12.8" fill="#2c3e50">honesty · transparency and</text>
<text x="1026" y="824.5" font-size="12.8" fill="#2c3e50">representation engineering · detecting</text>
<text x="1026" y="841.0" font-size="12.8" fill="#2c3e50">and removing hidden functionality</text>
<rect x="34" y="981.5" width="1260" height="46" fill="#f5f7f9"/>
<rect x="34" y="981.5" width="3" height="46" fill="#003A70"/>
<text x="52" y="1001.5" font-size="13" fill="#2c3e50">The four are not independent. The paper's §6 argues they compound: a race erodes organizational safety, weak organizations leak capable models to malicious actors, and both raise the</text>
<text x="52" y="1018.5" font-size="13" fill="#2c3e50">chance of losing control.</text>
<text x="34" y="1061.5" font-size="11.6" fill="#5a6672">Source: Hendrycks, D., Mazeika, M. &amp; Woodside, T. (2023), “An Overview of Catastrophic AI Risks”, arXiv:2306.12001. The four risk types and most subtypes are the paper's own section headings; under organizational</text>
<text x="34" y="1076.5" font-size="11.6" fill="#5a6672">risks, weak safety culture and the missing security mindset are drawn from the discussion in §4.2 rather than being headings. Mitigations condense the Suggestions sections (§2.5, §3.4, §4.3, §5.5) in the paper's</text>
<text x="34" y="1091.5" font-size="11.6" fill="#5a6672">wording.</text>
</svg>
