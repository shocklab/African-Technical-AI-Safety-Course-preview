<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 812" width="1240" height="812" font-family="Source Serif 4, Georgia, 'Times New Roman', serif">
<defs>
<marker id="ah-2a5298" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5298"/></marker>
<marker id="ah-003A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003A70"/></marker>
<marker id="ah-8a6d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/></marker>
<marker id="ah-5a6672" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6672"/></marker>
<marker id="ah-3f6b52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f6b52"/></marker>
</defs>
<rect width="1240" height="812" fill="#ffffff"/>
<text x="34" y="38" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="21" fill="#003A70">Constitutional AI, end to end</text>
<text x="34" y="60" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5a6672">Two phases. The model that judges in Phase 2 is not the model being trained, and the preference model is fed from two streams.</text>
<rect x="34" y="96" width="178" height="92" rx="6" fill="#eef4f0" stroke="#3f6b52" stroke-width="1.6"/>
<text x="123.0" y="121" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">The constitution</text>
<text x="123.0" y="141" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">a short list of written</text>
<text x="123.0" y="156" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">principles; one is sampled</text>
<text x="123.0" y="171" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">at each step</text>
<rect x="238" y="88" width="968" height="248" rx="8" fill="#f5f7f9" stroke="#e4e8ec" stroke-width="1.4"/>
<text x="258" y="112" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6672" letter-spacing="1">PHASE 1 · SUPERVISED (SL-CAI)</text>
<rect x="258" y="126" width="168" height="88" rx="6" fill="#ffffff" stroke="#2a5298" stroke-width="1.6"/>
<text x="342.0" y="151" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">Helpful-only model</text>
<text x="342.0" y="171" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">answers a red-team</text>
<text x="342.0" y="186" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">prompt, then critiques</text>
<text x="342.0" y="201" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">and revises its own answer</text>
<path d="M342 214 L342 238 L300 238 L300 214" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<text x="390" y="244" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#5a6672">repeat a few times</text>
<rect x="470" y="126" width="158" height="68" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="549.0" y="151" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">Final revisions</text>
<text x="549.0" y="171" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">the harmless answers</text>
<rect x="470" y="214" width="158" height="68" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="549.0" y="239" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">Helpful samples</text>
<text x="549.0" y="259" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">from the same model,</text>
<text x="549.0" y="274" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">on ordinary prompts</text>
<rect x="676" y="152" width="190" height="96" rx="6" fill="#ffffff" stroke="#003A70" stroke-width="1.6"/>
<text x="771.0" y="177" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="14.5" fill="#003A70">Supervised fine-tuning</text>
<text x="771.0" y="197" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">on both sets, of a</text>
<text x="771.0" y="212" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">pretrained model: not</text>
<text x="771.0" y="227" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">the one that wrote them</text>
<rect x="910" y="166" width="156" height="68" rx="6" fill="#ffffff" stroke="#003A70" stroke-width="1.6"/>
<text x="988.0" y="191" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">SL-CAI</text>
<text x="988.0" y="211" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">the Phase-1 model</text>
<path d="M212 142 L256 158" fill="none" stroke="#3f6b52" stroke-width="1.6" marker-end="url(#ah-3f6b52)"/>
<path d="M426 152 L468 152" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<path d="M426 190 L468 236" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<path d="M628 158 L674 184" fill="none" stroke="#5a6672" stroke-width="1.6" marker-end="url(#ah-5a6672)"/>
<path d="M628 248 L674 222" fill="none" stroke="#5a6672" stroke-width="1.6" marker-end="url(#ah-5a6672)" stroke-dasharray="5 4"/>
<path d="M866 200 L908 200" fill="none" stroke="#003A70" stroke-width="1.6" marker-end="url(#ah-003A70)"/>
<text x="739" y="312" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#5a6672">the helpful samples are why the result does not collapse into refusing everything</text>
<rect x="238" y="360" width="968" height="300" rx="8" fill="#f5f7f9" stroke="#e4e8ec" stroke-width="1.4"/>
<text x="258" y="384" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6672" letter-spacing="1">PHASE 2 · REINFORCEMENT LEARNING (RL-CAI)</text>
<rect x="258" y="398" width="158" height="68" rx="6" fill="#ffffff" stroke="#003A70" stroke-width="1.6"/>
<text x="337.0" y="423" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">SL-CAI</text>
<text x="337.0" y="443" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">samples two answers</text>
<text x="337.0" y="458" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">to each prompt</text>
<rect x="258" y="500" width="158" height="92" rx="6" fill="#fdf7e6" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="337.0" y="525" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">Feedback model</text>
<text x="337.0" y="545" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">a separate model,</text>
<text x="337.0" y="560" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">typically a pretrained</text>
<text x="337.0" y="575" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">one. Not the trainee.</text>
<rect x="470" y="442" width="176" height="78" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="558.0" y="467" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">Soft label</text>
<text x="558.0" y="487" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">p(A) from the option</text>
<text x="558.0" y="502" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">log-probabilities</text>
<rect x="694" y="398" width="196" height="72" rx="6" fill="#fdf7e6" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="792.0" y="423" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">AI comparisons</text>
<text x="792.0" y="443" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">harmlessness</text>
<rect x="694" y="496" width="196" height="72" rx="6" fill="#eef4f0" stroke="#3f6b52" stroke-width="1.6"/>
<text x="792.0" y="521" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#003A70">Human comparisons</text>
<text x="792.0" y="541" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">helpfulness</text>
<rect x="938" y="434" width="128" height="100" rx="6" fill="#ffffff" stroke="#003A70" stroke-width="1.6"/>
<text x="1002.0" y="459" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="13" fill="#003A70">Preference model</text>
<text x="1002.0" y="479" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">one hybrid model:</text>
<text x="1002.0" y="494" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">AI harmlessness,</text>
<text x="1002.0" y="509" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#2c3e50">human helpfulness</text>
<path d="M416 432 L468 460" fill="none" stroke="#003A70" stroke-width="1.6" marker-end="url(#ah-003A70)"/>
<path d="M416 528 L468 500" fill="none" stroke="#8a6d1f" stroke-width="1.6" marker-end="url(#ah-8a6d1f)"/>
<path d="M212 150 L224 150 L224 546 L256 546" fill="none" stroke="#3f6b52" stroke-width="1.6" marker-end="url(#ah-3f6b52)"/>
<path d="M646 470 L692 440" fill="none" stroke="#5a6672" stroke-width="1.6" marker-end="url(#ah-5a6672)"/>
<path d="M890 428 L936 462" fill="none" stroke="#8a6d1f" stroke-width="1.6" marker-end="url(#ah-8a6d1f)"/>
<path d="M890 526 L936 500" fill="none" stroke="#3f6b52" stroke-width="1.6" marker-end="url(#ah-3f6b52)"/>
<path d="M1002 534 L1002 618 L248 618 L248 432 L254 432" fill="none" stroke="#003A70" stroke-width="1.6" marker-end="url(#ah-003A70)"/>
<text x="676" y="612" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#003A70">optimise SL-CAI against it with PPO, under the KL leash of 6.3</text>
<text x="676" y="644" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12" fill="#5a6672">the constitution does not appear in the RL step itself: it is already inside the reward model</text>
<text x="34" y="700" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6672" letter-spacing="1">WHICH MODEL IS WHICH</text>
<rect x="34" y="720" width="13" height="13" rx="2" fill="#ffffff" stroke="#2a5298" stroke-width="1.8"/>
<text x="56" y="731" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#003A70">Helpful-only model</text>
<text x="226" y="731" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">writes and revises in Phase 1</text>
<rect x="634" y="720" width="13" height="13" rx="2" fill="#ffffff" stroke="#003A70" stroke-width="1.8"/>
<text x="656" y="731" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#003A70">The model being trained</text>
<text x="826" y="731" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">pretrained → SL-CAI → RL-CAI</text>
<rect x="34" y="760" width="13" height="13" rx="2" fill="#fdf7e6" stroke="#8a6d1f" stroke-width="1.8"/>
<text x="56" y="771" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#003A70">Feedback model</text>
<text x="226" y="771" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">judges in Phase 2; never trained here</text>
<rect x="634" y="760" width="13" height="13" rx="2" fill="#eef4f0" stroke="#3f6b52" stroke-width="1.8"/>
<text x="656" y="771" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#003A70">Human input</text>
<text x="826" y="771" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">the constitution and the helpfulness labels</text>
</svg>
