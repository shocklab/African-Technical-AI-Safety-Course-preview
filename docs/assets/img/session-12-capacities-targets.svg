<text x="35" y="74" font-family='Source Serif 4, Georgia, serif' font-size="16" fill="#5a6672">The row is what governance needs to do. The column is where it acts.</text>
<text x="35" y="106" font-family='IBM Plex Mono, ui-monospace, monospace' font-size="13" fill="#2a5298">CAPACITY</text>
