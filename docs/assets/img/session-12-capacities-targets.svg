<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" role="img" aria-labelledby="title desc">
<title id="title">Technical AI governance capacities by targets</title><desc id="desc">Six capacities form the rows: assessment, access, verification, security, operationalisation and ecosystem monitoring. Four targets form the columns: data, compute, models and algorithms, and deployment. Selected example cells show deployment evaluation results, compute chip attestation, model weight security and model risk thresholds. The examples are illustrative, and categories may overlap.</desc>
