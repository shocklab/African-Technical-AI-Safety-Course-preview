<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="526" viewBox="0 0 1190 526" role="img" aria-labelledby="title desc"><title id="title">Illustrative arithmetic of the rebound effect</title><desc id="desc">Before: 1 energy unit per query times 100 queries equals 100 units. After an efficiency gain: 0.5 unit per query times 300 queries equals 150 units. The per-query energy halves, but use triples and total energy rises by 50 percent. These are invented values used only to illustrate the arithmetic, not observed AI energy data.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#2a5298"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#a45216"/></marker></defs><rect width="1190" height="526" fill="white"/><text x="36" y="49" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="30" font-weight="400" text-anchor="start">Efficiency can improve while total use rises</text><text x="36" y="77" fill="#a45216" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Illustrative arithmetic only; these are not measured AI energy figures.</text><text x="50" y="128" fill="#2a5298" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="start">ENERGY PER QUERY</text><text x="425" y="128" fill="#2a5298" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="start">NUMBER OF QUERIES</text><text x="828" y="128" fill="#2a5298" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="start">TOTAL ENERGY</text><rect x="36" y="165" width="1117" height="119" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="56" y="200" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">Before</text><text x="58" y="243" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="23" font-weight="400" text-anchor="start">1 unit/query</text><text x="450" y="243" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="28" font-weight="400" text-anchor="start">×</text><text x="485" y="243" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="23" font-weight="400" text-anchor="start">100 queries</text><text x="813" y="243" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="28" font-weight="400" text-anchor="start">=</text><text x="853" y="243" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="25" font-weight="700" text-anchor="start">100 units</text><rect x="36" y="305" width="1117" height="119" rx="10" fill="#eaf4eb" stroke="#cbd8e5" stroke-width="2"/><text x="56" y="340" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">After efficiency gain</text><text x="58" y="383" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="23" font-weight="400" text-anchor="start">0.5 unit/query</text><text x="450" y="383" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="28" font-weight="400" text-anchor="start">×</text><text x="485" y="383" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="23" font-weight="400" text-anchor="start">300 queries</text><text x="813" y="383" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="28" font-weight="400" text-anchor="start">=</text><text x="853" y="383" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="25" font-weight="700" text-anchor="start">150 units</text><text x="36" y="459" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="400" text-anchor="start">Per-query energy halves; use triples; total energy rises by 50%.</text><text x="36" y="489" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="400" text-anchor="start">Total energy = energy per query × number of queries. Real outcomes require measured demand and energy.</text></svg>