<svg xmlns="http://www.w3.org/2000/svg" width="1194" height="534" viewBox="0 0 1194 534" role="img" aria-labelledby="title desc"><title id="title">Trust boundary in indirect prompt injection</title><desc id="desc">A legitimate user asks an assistant to summarise an email. The email is attacker-controlled and includes text requesting private mail be sent out. A dashed orange arrow shows the possible failure: the assistant treats untrusted email content as an instruction. A tool-action check validates the destination, data and authority before the email tool acts.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#2a5298"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#a45216"/></marker></defs><rect width="1194" height="534" fill="white"/><text x="36" y="49" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="30" font-weight="400" text-anchor="start">Indirect prompt injection crosses a trust boundary</text><text x="36" y="77" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">A request to summarise an email should not give the email authority to command the assistant.</text><rect x="40" y="116" width="276" height="88" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="61" y="149" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">User request</text><text x="61" y="181" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="400" text-anchor="start">“Summarise this email.”</text><rect x="40" y="273" width="276" height="115" rx="10" fill="#fff1e5" stroke="#a45216" stroke-width="2"/><text x="61" y="307" fill="#a45216" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">Attacker-controlled email</text><text x="61" y="337" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Contains text asking for</text><text x="61" y="363" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">private mail to be sent out</text><rect x="409" y="173" width="257" height="162" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="432" y="212" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="700" text-anchor="start">Assistant</text><text x="432" y="245" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="400" text-anchor="start">Reads the email as data</text><text x="432" y="275" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">May wrongly treat its text</text><text x="432" y="300" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">as an instruction</text><line x1="318" y1="160" x2="396" y2="226" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><line x1="318" y1="329" x2="396" y2="278" stroke="#a45216" stroke-width="3" marker-end="url(#arrow-orange)" stroke-dasharray="8 5"/><text x="334" y="383" fill="#a45216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="start">UNTRUSTED</text><line x1="670" y1="253" x2="715" y2="253" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><rect x="729" y="173" width="218" height="162" rx="10" fill="#eaf4eb" stroke="#286342" stroke-width="2"/><text x="749" y="211" fill="#286342" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">Tool-action check</text><text x="749" y="242" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Validate destination,</text><text x="749" y="269" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">data and authority</text><text x="749" y="302" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Reject unsafe calls</text><line x1="950" y1="253" x2="992" y2="253" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><rect x="1001" y="190" width="157" height="127" rx="10" fill="#f5f7f9" stroke="#cbd8e5" stroke-width="2"/><text x="1020" y="225" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="19" font-weight="700" text-anchor="start">Email tool</text><text x="1020" y="256" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Send or deny</text><text x="1020" y="283" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">the action</text><rect x="36" y="421" width="1122" height="84" rx="10" fill="#fffaf5" stroke="#a45216" stroke-width="2"/><text x="57" y="452" fill="#a45216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="start">POSSIBLE FAILURE</text><text x="57" y="482" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="400" text-anchor="start">Untrusted email text is promoted into an instruction. The tool check limits what the mistake can do.</text></svg>