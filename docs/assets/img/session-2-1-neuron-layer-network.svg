<text x="130" y="328" font-family="Source Serif 4, Georgia, serif" font-size="17" fill="#2c3e50" text-anchor="start">w<tspan baseline-shift="sub" font-size="70%">3</tspan></text>
<circle cx="204" cy="270" r="22" fill="white" stroke="#2a5298" stroke-width="1.6"/><text x="204" y="277" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#003A70" text-anchor="middle">Σ</text>
<text x="204" y="320" font-family="Source Serif 4, Georgia, serif" font-size="18" fill="#2c3e50" text-anchor="middle">+ b</text>
<path d="M228 270 H265" fill="none" stroke="#2a5298" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="267" y="246" width="42" height="48" rx="8" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="1.6"/>
<text x="288" y="278" font-family="Source Serif 4, Georgia, serif" font-size="24" fill="#003A70" text-anchor="middle">σ</text>
<path d="M310 270 H341" fill="none" stroke="#2a5298" stroke-width="2" marker-end="url(#arrow)"/>
<text x="346" y="278" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#003A70" text-anchor="middle">a</text>
<text x="56" y="414" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#003A70" text-anchor="start">a = σ(w · x + b)</text>
<text x="56" y="460" font-family="Source Serif 4, Georgia, serif" font-size="18" fill="#2c3e50" text-anchor="start">One weighted sum,</text>
<text x="56" y="486" font-family="Source Serif 4, Georgia, serif" font-size="18" fill="#2c3e50" text-anchor="start">then one nonlinearity.</text>
