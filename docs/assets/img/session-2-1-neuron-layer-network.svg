<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">From a neuron to a network</title>
<desc id="desc">Panel A: three inputs enter a weighted sum plus bias, followed by a scalar nonlinearity. Panel B: three inputs connect to four weighted sums, each followed by its own pointwise nonlinearity and one output. Each weight row defines one neuron. Panel C: a deep network composes L such layers, with h at layer zero equal to x. The node counts in A and B are illustrative.</desc>
<rect width="1200" height="850" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2a5298"/></marker></defs>
<text x="34" y="48" font-family="Source Serif 4, Georgia, serif" font-size="30" fill="#003A70" text-anchor="start">From a neuron to a network</text>
<rect x="34" y="90" width="340" height="445" rx="8" fill="#f5f7f9" stroke="#cbd8e5" stroke-width="1.6"/>
<rect x="398" y="90" width="768" height="445" rx="8" fill="#f5f7f9" stroke="#cbd8e5" stroke-width="1.6"/>
<text x="54" y="127" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#003A70" text-anchor="start">(A) A neuron</text>
<text x="420" y="127" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#003A70" text-anchor="start">(B) A layer</text>
