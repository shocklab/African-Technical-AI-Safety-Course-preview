<path d="M632 670 H696" fill="none" stroke="#2a5298" stroke-width="2" marker-end="url(#arrow)"/>
<text x="744" y="678" font-family="Source Serif 4, Georgia, serif" font-size="30" fill="#003A70" text-anchor="middle">…</text>
<path d="M786 670 H842" fill="none" stroke="#2a5298" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1052 670 H1098" fill="none" stroke="#2a5298" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1130" y="678" font-family="Source Serif 4, Georgia, serif" font-size="24" fill="#003A70" text-anchor="middle">ŷ</text>
<text x="600" y="757" font-family="Source Serif 4, Georgia, serif" font-size="24" fill="#003A70" text-anchor="middle">h<tspan baseline-shift="super" font-size="70%">(ℓ)</tspan> = σ(W<tspan baseline-shift="super" font-size="70%">(ℓ)</tspan> h<tspan baseline-shift="super" font-size="70%">(ℓ−1)</tspan> + b<tspan baseline-shift="super" font-size="70%">(ℓ)</tspan>),   h<tspan baseline-shift="super" font-size="70%">(0)</tspan> = x</text>
<text x="600" y="791" font-family="Source Serif 4, Georgia, serif" font-size="18" fill="#2c3e50" text-anchor="middle">Without σ, composing these affine maps gives a single affine map.</text>
</svg>
