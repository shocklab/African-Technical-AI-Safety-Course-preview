<rect x="846" y="636" width="204" height="68" rx="8" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="1.6"/>
<text x="948" y="663" font-family="Source Serif 4, Georgia, serif" font-size="20" fill="#003A70" text-anchor="middle">Layer L</text>
<text x="948" y="688" font-family="Source Serif 4, Georgia, serif" font-size="18" fill="#2c3e50" text-anchor="middle">affine map, then σ</text>
