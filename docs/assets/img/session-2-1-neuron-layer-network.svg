<text x="576" y="165" font-family="Source Serif 4, Georgia, serif" font-size="21" fill="#003A70" text-anchor="middle">W</text>
<text x="1130" y="254" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#003A70" text-anchor="middle">h</text>
<text x="420" y="414" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#003A70" text-anchor="start">h = σ(Wx + b)</text>
<text x="420" y="452" font-family="Source Serif 4, Georgia, serif" font-size="21" fill="#2c3e50" text-anchor="start">W ∈ ℝ<tspan baseline-shift="super" font-size="70%">d<tspan baseline-shift="sub" font-size="70%">out</tspan> × d<tspan baseline-shift="sub" font-size="70%">in</tspan></tspan>;  b, h ∈ ℝ<tspan baseline-shift="super" font-size="70%">d<tspan baseline-shift="sub" font-size="70%">out</tspan></tspan>;  x ∈ ℝ<tspan baseline-shift="super" font-size="70%">d<tspan baseline-shift="sub" font-size="70%">in</tspan></tspan></text>
<text x="420" y="488" font-family="Source Serif 4, Georgia, serif" font-size="18" fill="#2c3e50" text-anchor="start">Each row of W gives one weighted sum. σ acts elementwise.</text>
<rect x="34" y="565" width="1132" height="250" rx="8" fill="#f5f7f9" stroke="#cbd8e5" stroke-width="1.6"/>
<text x="54" y="602" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#003A70" text-anchor="start">(C) A network</text>
<text x="76" y="679" font-family="Source Serif 4, Georgia, serif" font-size="24" fill="#003A70" text-anchor="middle">x</text>
<rect x="146" y="636" width="204" height="68" rx="8" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="1.6"/>
