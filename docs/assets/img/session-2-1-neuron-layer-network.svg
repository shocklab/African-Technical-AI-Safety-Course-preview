<text x="130" y="188" font-family="Source Serif 4, Georgia, serif" font-size="17" fill="#2c3e50" text-anchor="start">w<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<path d="M98 270 L180 270" fill="none" stroke="#2a5298" stroke-width="2" marker-end="url(#arrow)"/>
