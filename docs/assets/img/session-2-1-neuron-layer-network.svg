<circle cx="468" cy="270" r="22" fill="white" stroke="#2a5298" stroke-width="1.6"/><text x="468" y="277" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#003A70" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<circle cx="468" cy="340" r="22" fill="white" stroke="#2a5298" stroke-width="1.6"/><text x="468" y="347" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#003A70" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">3</tspan></text>
