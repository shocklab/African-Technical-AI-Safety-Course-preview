<svg xmlns="http://www.w3.org/2000/svg" width="1187" height="494" viewBox="0 0 1187 494" role="img" aria-labelledby="title desc"><title id="title">Outer and inner alignment gaps</title><desc id="desc">Four boxes show human intention, base objective, a possible learned objective, and observed behaviour. Outer alignment concerns whether the base objective encodes human intention. Inner alignment concerns whether training produces a learned goal matching the base objective. A model may perform well in training despite a correlated proxy goal.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#2a5298"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#a45216"/></marker></defs><rect width="1187" height="494" fill="white"/><text x="36" y="49" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="30" font-weight="400" text-anchor="start">Two places an alignment attempt can fail</text><text x="36" y="77" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">A training objective can miss our intent; a learned objective can miss the training objective.</text><rect x="35" y="136" width="250" height="147" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="53" y="175" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">Human intention</text><text x="53" y="210" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">What we want</text><text x="53" y="237" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">the system to do</text><rect x="324" y="136" width="250" height="147" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="342" y="175" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">Base objective</text><text x="342" y="210" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Loss or reward</text><text x="342" y="237" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">used in training</text><rect x="613" y="136" width="250" height="147" rx="10" fill="#fff1e5" stroke="#cbd8e5" stroke-width="2"/><text x="631" y="175" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">Possible learned objective</text><text x="631" y="210" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Goal the model may</text><text x="631" y="237" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">pursue internally</text><rect x="902" y="136" width="250" height="147" rx="10" fill="#eaf4eb" stroke="#cbd8e5" stroke-width="2"/><text x="920" y="175" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">Observed behaviour</text><text x="920" y="210" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">What the model does</text><text x="920" y="237" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">on a tested task</text><line x1="286" y1="210" x2="313" y2="210" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><line x1="575" y1="210" x2="602" y2="210" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><line x1="864" y1="210" x2="891" y2="210" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><rect x="126" y="313" width="356" height="79" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="147" y="344" fill="#2a5298" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="start">OUTER ALIGNMENT</text><text x="147" y="372" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="400" text-anchor="start">Does the reward encode the intention?</text><rect x="520" y="313" width="408" height="79" rx="10" fill="#fff1e5" stroke="#cbd8e5" stroke-width="2"/><text x="541" y="344" fill="#a45216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="start">INNER ALIGNMENT</text><text x="541" y="372" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="400" text-anchor="start">Did training produce the intended goal?</text><text x="36" y="436" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="400" text-anchor="start">Good training performance can fit both the intended goal and a correlated proxy.</text><text x="36" y="466" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="15" font-weight="400" text-anchor="start">The “possible learned objective” box applies when the model learns an internal objective.</text></svg>