<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="560" viewBox="0 0 1130 560" role="img" aria-labelledby="title desc"><title id="title">Sandwiching experiment for scalable oversight</title><desc id="desc">The same task and model answer is assessed by an unaided non-expert and by a non-expert using an oversight aid. Both judgements are compared with an expert answer to ask whether the aid improves judgement. The diagram illustrates a test design and reports no empirical result.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#2a5298"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#a45216"/></marker></defs><rect width="1130" height="560" fill="white"/><text x="36" y="49" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="30" font-weight="400" text-anchor="start">Testing an oversight protocol by sandwiching</text><text x="36" y="77" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Use a task where the model outperforms a non-expert but an expert can still check the answer.</text><rect x="360" y="105" width="410" height="79" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="565" y="138" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="21" font-weight="700" text-anchor="middle">Same task and model answer</text><text x="565" y="165" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="400" text-anchor="middle">Both arms judge the same material</text><line x1="460" y1="186" x2="278" y2="238" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><line x1="670" y1="186" x2="855" y2="238" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><rect x="55" y="242" width="447" height="130" rx="10" fill="#f5f7f9" stroke="#cbd8e5" stroke-width="2"/><text x="78" y="279" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="21" font-weight="700" text-anchor="start">Comparison: unaided non-expert</text><text x="78" y="310" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Reads the model answer alone</text><text x="78" y="339" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Records a judgement and confidence</text><rect x="628" y="242" width="447" height="130" rx="10" fill="#eaf4eb" stroke="#cbd8e5" stroke-width="2"/><text x="650" y="279" fill="#286342" font-family="Source Serif 4, Georgia, serif" font-size="21" font-weight="700" text-anchor="start">Non-expert with oversight aid</text><text x="650" y="310" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Uses critique, decomposition or another protocol</text><text x="650" y="339" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="17" font-weight="400" text-anchor="start">Records a judgement and confidence</text><line x1="280" y1="374" x2="461" y2="420" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><line x1="851" y1="374" x2="666" y2="420" stroke="#2a5298" stroke-width="3" marker-end="url(#arrow-blue)" /><rect x="363" y="424" width="402" height="105" rx="10" fill="#e9f2fa" stroke="#cbd8e5" stroke-width="2"/><text x="564" y="459" fill="#003A70" font-family="Source Serif 4, Georgia, serif" font-size="21" font-weight="700" text-anchor="middle">Compare with expert answer</text><text x="564" y="487" fill="#243446" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="400" text-anchor="middle">Does the aid improve judgement?</text><text x="564" y="512" fill="#586a7a" font-family="Source Serif 4, Georgia, serif" font-size="15" font-weight="400" text-anchor="middle">No gain is also a result.</text></svg>