<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 724" width="1240" height="724" font-family="Source Serif 4, Georgia, 'Times New Roman', serif">
<defs>
<marker id="ah-2a5298" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5298"/></marker>
<marker id="ah-003A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003A70"/></marker>
<marker id="ah-8a6d1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/></marker>
<marker id="ah-5a6672" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6672"/></marker>
</defs>
<rect width="1240" height="724" fill="#ffffff"/>
<text x="34" y="38" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="21" fill="#003A70">One step of RLHF: the loop, and the leash</text>
<text x="34" y="60" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5a6672">Everything above the dashed line is what the rest of the course uses. The panel below it is PPO’s own bookkeeping.</text>
<rect x="34" y="104" width="160" height="70" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="114.0" y="132" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">Prompt  x</text>
<text x="114.0" y="154" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">drawn from a prompt set</text>
<rect x="234" y="96" width="200" height="88" rx="6" fill="#ffffff" stroke="#003A70" stroke-width="1.6"/>
<text x="334.0" y="124" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">πθ   the policy</text>
<text x="334.0" y="146" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">the model being trained,</text>
<text x="334.0" y="162" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">started from the SFT model</text>
<rect x="474" y="104" width="190" height="70" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="569.0" y="132" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">Response  y</text>
<text x="569.0" y="154" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">sampled from πθ</text>
<rect x="712" y="62" width="210" height="88" rx="6" fill="#ffffff" stroke="#2a5298" stroke-width="1.6"/>
<text x="817.0" y="90" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">rφ   reward model</text>
<text x="817.0" y="112" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">learned from human</text>
<text x="817.0" y="128" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">preferences (6.2)</text>
<rect x="712" y="186" width="210" height="88" rx="6" fill="#fdf7e6" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="817.0" y="214" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">πref   frozen SFT</text>
<text x="817.0" y="236" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">never updated; the anchor</text>
<text x="817.0" y="252" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">the leash pulls back to</text>
<rect x="968" y="96" width="232" height="148" rx="6" fill="#ffffff" stroke="#003A70" stroke-width="1.6"/>
<text x="1084.0" y="124" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">Objective</text>
<text x="1084.0" y="146" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">rφ(x, y)</text>
<text x="1084.0" y="162" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">−  β · KL(πθ ‖ πref)</text>
<line x1="984" y1="184" x2="1184" y2="184" stroke="#e4e8ec" stroke-width="1"/>
<text x="1084.0" y="202" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="11.5" fill="#8a6d1f">β is the safety dial: small β</text>
<text x="1084.0" y="217" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="11.5" fill="#8a6d1f">chases the proxy, large β</text>
<text x="1084.0" y="232" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="11.5" fill="#8a6d1f">stays close to πref</text>
<path d="M194 139 L230 140" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<path d="M434 140 L470 139" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<line x1="664" y1="139" x2="688" y2="139" stroke="#2a5298" stroke-width="1.6"/>
<line x1="688" y1="106" x2="688" y2="230" stroke="#2a5298" stroke-width="1.6"/>
<path d="M688 106 L710 106" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<path d="M688 230 L710 230" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<path d="M922 106 L966 132" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<path d="M922 230 L966 196" fill="none" stroke="#2a5298" stroke-width="1.6" marker-end="url(#ah-2a5298)"/>
<path d="M990 244 L990 322 L334 322 L334 186" fill="none" stroke="#003A70" stroke-width="1.6" marker-end="url(#ah-003A70)"/>
<text x="662" y="314" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#003A70">update θ to raise the objective, then repeat</text>
<line x1="34" y1="352" x2="1206" y2="352" stroke="#e4e8ec" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="34" y="372" width="1172" height="246" rx="8" fill="#f5f7f9" stroke="#e4e8ec" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="56" y="398" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6672" letter-spacing="1">PPO’S BOOKKEEPING · READ PAST THIS ON A FIRST PASS</text>
<text x="56" y="421" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2c3e50">Sampling is expensive, so PPO reuses one batch of responses for several gradient steps. That is the only reason a third policy exists.</text>
<rect x="56" y="436" width="248" height="84" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="180.0" y="464" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">πold   the snapshot</text>
<text x="180.0" y="486" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">a frozen copy of πθ that</text>
<text x="180.0" y="502" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">the batch was sampled from</text>
<rect x="336" y="436" width="248" height="84" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="460.0" y="464" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">Probability ratio</text>
<text x="460.0" y="486" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">ρ = πθ(y) / πold(y):</text>
<text x="460.0" y="502" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">how far θ has drifted</text>
<rect x="616" y="436" width="248" height="84" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="740.0" y="464" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">Clip</text>
<text x="740.0" y="486" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">hold ρ inside 1 ± ε so one</text>
<text x="740.0" y="502" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">batch cannot move θ far</text>
<rect x="896" y="436" width="248" height="84" rx="6" fill="#ffffff" stroke="#5a6672" stroke-width="1.6"/>
<text x="1020.0" y="464" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16.5" fill="#003A70">Advantage  Â</text>
<text x="1020.0" y="486" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">was this response better</text>
<text x="1020.0" y="502" text-anchor="middle" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">than expected?</text>
<path d="M304 478.0 L334 478.0" fill="none" stroke="#5a6672" stroke-width="1.6" marker-end="url(#ah-5a6672)"/>
<path d="M584 478.0 L614 478.0" fill="none" stroke="#5a6672" stroke-width="1.6" marker-end="url(#ah-5a6672)"/>
<path d="M864 478.0 L894 478.0" fill="none" stroke="#5a6672" stroke-width="1.6" marker-end="url(#ah-5a6672)"/>
<path d="M1020.0 520 L1020.0 542 L180.0 542 L180.0 522" fill="none" stroke="#5a6672" stroke-width="1.6" marker-end="url(#ah-5a6672)"/>
<text x="620" y="538" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#5a6672">refresh πold every few steps and go again</text>
<text x="56" y="575" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="13" fill="#5a6672">πold is not πref. πold is refreshed constantly and only keeps the update stable; πref is frozen for the whole run, and is what the KL penalty measures against.</text>
<text x="56" y="596" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="13" fill="#5a6672">“Better than expected” needs a baseline for what was expected. A second network, the critic, is trained alongside the policy to supply it.</text>
<text x="34" y="658" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6672" letter-spacing="1">THREE POLICIES, ONE JOB EACH</text>
<rect x="34" y="674" width="11" height="11" rx="2" fill="#003A70"/>
<text x="53" y="684" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#003A70">πθ</text>
<text x="96" y="684" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">the one being trained</text>
<rect x="434" y="674" width="11" height="11" rx="2" fill="#8a6d1f"/>
<text x="453" y="684" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#003A70">πref</text>
<text x="496" y="684" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">frozen; the leash measures distance from it</text>
<rect x="834" y="674" width="11" height="11" rx="2" fill="#5a6672"/>
<text x="853" y="684" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#003A70">πold</text>
<text x="896" y="684" text-anchor="start" font-family="Source Serif 4, Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2c3e50">a recent snapshot; PPO detail only</text>
</svg>
